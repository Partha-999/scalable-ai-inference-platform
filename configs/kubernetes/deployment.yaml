apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-inference-platform
  template:
    metadata:
      labels:
        app: ai-inference-platform
    spec:
      containers:
        - name: app
          image: ai-inference-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-inference-platform-config
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
