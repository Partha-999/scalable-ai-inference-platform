global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ai-inference-platform
    metrics_path: /api/v1/health/metrics
    static_configs:
      - targets: ["app:8000"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: ray-serve
    static_configs:
      - targets: ["app:8080"]
